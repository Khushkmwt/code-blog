<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Dev blog site icon</title>
  <desc id="desc">A terminal-prompt mark: a chevron and cursor block on a dark navy rounded square, used as a logo or favicon for a developer blog.</desc>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="#182231"/>

  <polyline points="178,148 332,256 178,364"
            fill="none"
            stroke="#F3F0E7"
            stroke-width="46"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <rect x="336" y="328" width="96" height="46" rx="10" fill="#E8A23D"/>
</svg>
